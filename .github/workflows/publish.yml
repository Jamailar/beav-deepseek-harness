name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-14
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml
      - name: Build Harness contracts
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile && pnpm run build:lib
      - name: Verify connector
        working-directory: plugin
        run: pnpm install --frozen-lockfile && pnpm check
      - name: Verify release identity
        working-directory: plugin
        run: |
          package_version=$(node -p "require('./package.json').version")
          test "v$package_version" = "${{ github.event.release.tag_name }}"
      - name: Publish with provenance
        working-directory: plugin
        run: |
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")
          published_git_head=$(npm view "$package_name@$package_version" gitHead --json 2>/dev/null | tr -d '"' || true)
          release_git_head=$(git rev-parse HEAD)

          if [ -n "$published_git_head" ]; then
            test "$published_git_head" = "$release_git_head"
            echo "$package_name@$package_version already matches $release_git_head"
            exit 0
          fi

          npm publish --access public --provenance
